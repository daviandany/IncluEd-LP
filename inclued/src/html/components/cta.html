<section id="contato" class="cta" data-component="cta">
    <div class="container cta__container">
        <div class="cta__content">
            <h2 class="cta__title">Pronto para transformar sua sala de aula?</h2>
            <p class="cta__description">
                Junte-se a milhares de educadores que já estão usando a IncluiEd para 
                criar experiências verdadeiramente inclusivas.
            </p>
            <form class="cta__form" data-component="newsletter-form" novalidate>
                <div class="form-group">
                    <label for="email" class="visually-hidden">Seu e-mail</label>
                    <input type="email" id="email" name="email" class="form-input" 
                           placeholder="Digite seu e-mail" required 
                           aria-required="true" aria-describedby="email-error">
                    <span id="email-error" class="form-error" role="alert" aria-live="polite"></span>
                </div>
                <button type="submit" class="btn btn--primary btn--large">
                    Começar Grátis
                </button>
            </form>
            <p class="cta__note">✓ Teste gratuito por 14 dias. Sem cartão de crédito.</p>
        </div>
    </div>
</section>
